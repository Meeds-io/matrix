# Hidden instructions for the Matrix chat UX bindings.
# Modeled on the AI addon's own bindings (Summarize-Notes / Rewrite-text / Rephrase-my-writing):
#   - promptTemplate        : the user-facing instruction sent to the agent
#   - outputPromptTemplate   : extra (hidden) context appended; {content_body} is replaced
#                              inline by the text the chat front-end passes as objectContent.
# {content_body} = the message text / conversation messages / unread digest provided by the UI.

# --- Single message ---
AiAgentChat.uxBindings.Chat-Summarize-Message.name=Résumer ce message
AiAgentChat.uxBindings.Chat-Summarize-Message.promptTemplate=Donne un bref résumé clair du message ci-dessous.
AiAgentChat.uxBindings.Chat-Summarize-Message.outputPromptTemplate=# Message de chat à résumer :\n{content_body}

AiAgentChat.uxBindings.Chat-Translate-Message.name=Traduire ce message
AiAgentChat.uxBindings.Chat-Translate-Message.promptTemplate=Détecte la langue du message ci-dessous et traduis-la dans ma langue. Indique d'abord la langue source détectée, puis donne la traduction.
AiAgentChat.uxBindings.Chat-Translate-Message.outputPromptTemplate=# Message de chat à traduire :\n{content_body}

AiAgentChat.uxBindings.Chat-Draft-Reply.name=Proposer une réponse
AiAgentChat.uxBindings.Chat-Draft-Reply.promptTemplate=Propose une réponse claire, amicale et concise au message de chat ci-dessous. Ne retourne que le texte de réponse suggéré.
AiAgentChat.uxBindings.Chat-Draft-Reply.outputPromptTemplate=# Message de chat pour répondre à :\n{content_body}

# --- Whole conversation (tool-based: agent reads messages via the get_chat_messages MCP tool) ---
AiAgentChat.uxBindings.Chat-Summarize-Room.name=Résumer cette conversation
AiAgentChat.uxBindings.Chat-Summarize-Room.promptTemplate=Résume cette conversation de manière brève, structurée : sujets principaux, points clés, décisions, questions ou actions ouvertes à suivre.
AiAgentChat.uxBindings.Chat-Summarize-Room.outputPromptTemplate=Utilise l'outil get_chat_messages avec conversation_id "{content_id}" pour lire les messages récents de cette conversation, puis écris le résumé.

# --- Across conversations / catch-up (tool-based: agent reads via get_unread_chat_messages) ---
AiAgentChat.uxBindings.Chat-Summarize-Conversations.name=Me remettre à jour
AiAgentChat.uxBindings.Chat-Summarize-Conversations.promptTemplate=Donne-moi un résumé concis de mes conversations récentes : qui a écrit et à propos de quoi, regroupés par conversation, et signalent clairement tout ce qui a besoin de mon attention ou d'une réponse.
AiAgentChat.uxBindings.Chat-Summarize-Conversations.outputPromptTemplate=Appelle l'outil get_unread_chat_messages pour récupérer mes conversations non lues et leurs messages récents, puis écris le résumé. S'il n'y a pas de messages non lus, dis-moi qu'il n'y a rien de nouveau.
